[project]
name = "pathsnap"
version = "0.1.0"
description = "PathSnap: map-matching noisy GPS trajectories to a road network (ML hackathon)"
readme = "README.md"
authors = [
    { name = "Adarsha.E", email = "adarsh.edurkala33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
pathsnap = "pathsnap:main"

[project.optional-dependencies]
models = [
    "catboost>=1.2.10",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "xgboost>=3.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
